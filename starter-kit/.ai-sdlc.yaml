# A-Dev Hardness Per-Repository Configuration
# Schema: framework/hardness/ai-sdlc-schema.json
# Specification: framework/hardness/09-per-repo-configuration.md
# Trust Ladder: framework/hardness/08-trust-ladder-and-autonomy-levels.md

version: "1.0.0"
repository: "my-org/my-project"

trust_ladder:
  # Active operational level: shadow | suggest | auto-PR | auto-merge-low | auto-merge-all | auto-deploy
  current_level: "auto-PR"
  target_level: "auto-merge-low"

  # Evaluation window required before promotion review
  evaluation_window:
    min_pull_requests: 20
    min_days: 14

  # Promotion metric gates
  promotion_gates:
    min_merge_success_rate: 0.90      # Minimum PR merge rate without rework (90%)
    max_revert_rate: 0.00             # Maximum allowed revert rate (0%)
    max_escalation_rate: 0.05         # Maximum allowed human takeover rate (5%)
    min_ci_first_pass_rate: 0.85      # Minimum CI first-pass pass rate (85%)
    min_policy_conformance_rate: 1.00 # 100% compliance with hardness policies

  # Demotion triggers on quality SLO breach or security violation
  demotion_triggers:
    max_revert_rate_slo: 0.02         # Demote if revert rate exceeds 2%
    max_consecutive_failures: 2       # Demote if 2 consecutive builds fail
    max_escalation_rate_slo: 0.10     # Demote if escalation rate exceeds 10%
    instant_demotion_on_security_breach: true
    demote_to_level: "suggest"

  # Recovery protocol after demotion
  rehabilitation:
    cooldown_days: 7
    required_clean_runs: 10
    requires_human_signoff: true

risk_boundaries:
  # Paths eligible for autonomous merge at Level 3 (auto-merge-low)
  low_risk_paths:
    - "docs/**"
    - "*.md"
    - "tests/fixtures/**"
    - "starter-kit/**"

  # Paths strictly requiring human review and approval
  high_risk_paths:
    - ".github/workflows/**"
    - "security/**"
    - "auth/**"
    - "billing/**"
    - "migrations/**"

  # Target branches governed by hardness policies
  protected_branches:
    - "main"
    - "release/*"

automated_merge_rules:
  require_all_ci_passing: true
  require_zero_blocking_reviews: true
  require_no_unresolved_comments: true
  allowed_merge_methods:
    - "squash"
    - "merge"
  delete_branch_after_merge: true

deployment:
  enabled: false
  target_environments:
    - "staging"
  canary_verification_duration_minutes: 15
  auto_rollback_on_health_failure: true

audit_and_observability:
  log_decisions: true
  evidence_retention: "repository-record"
  metrics_collection: "git-native"
